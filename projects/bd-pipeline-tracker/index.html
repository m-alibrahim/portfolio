<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>متابعة عملاء تطوير الأعمال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --hover:#F1F4F8;
  --line:#E2E7EE; --line-2:#CBD4E0;
  --text:#0D1F3C; --text-2:#34445C; --muted:#6B7A90;
  --accent:#0D1F3C; --accent-ink:#FFFFFF; --accent-soft:#E7ECF4;
  --gold:#C9A84C; --gold-ink:#8A6A1E; --gold-soft:#F7F0DC;
  --ok:#1D6F52; --ok-soft:#E3F2EA;
  --warn:#A8620A; --warn-soft:#FDF1DD;
  --bad:#B23A2F; --bad-soft:#FBEAE8;
  --info:#1B5E8C; --info-soft:#E5EFF7;
  --shadow-sm:0 1px 2px rgba(13,31,60,.06);
  --shadow:0 18px 40px -16px rgba(13,31,60,.30);
  --scrim:rgba(13,31,60,.28);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#101B2E; --surface-2:#0D1727; --hover:#16233A;
    --line:#1F2E47; --line-2:#2C4163;
    --text:#E7ECF3; --text-2:#C3CEDD; --muted:#8C9CB4;
    --accent:#DCE5F2; --accent-ink:#0A1220; --accent-soft:#1B2A44;
    --gold:#D9BE6A; --gold-ink:#E3C877; --gold-soft:#2C2515;
    --ok:#7BC9A3; --ok-soft:#12291F;
    --warn:#E6AE5C; --warn-soft:#2E2210;
    --bad:#E58A7E; --bad-soft:#321816;
    --info:#86BCE3; --info-soft:#12263A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 18px 40px -16px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#101B2E; --surface-2:#0D1727; --hover:#16233A;
  --line:#1F2E47; --line-2:#2C4163;
  --text:#E7ECF3; --text-2:#C3CEDD; --muted:#8C9CB4;
  --accent:#DCE5F2; --accent-ink:#0A1220; --accent-soft:#1B2A44;
  --gold:#D9BE6A; --gold-ink:#E3C877; --gold-soft:#2C2515;
  --ok:#7BC9A3; --ok-soft:#12291F;
  --warn:#E6AE5C; --warn-soft:#2E2210;
  --bad:#E58A7E; --bad-soft:#321816;
  --info:#86BCE3; --info-soft:#12263A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 18px 40px -16px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  direction:rtl;color:var(--text);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;flex:0 0 228px;width:228px;
  background:var(--surface);border-inline-start:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 10px;gap:14px;z-index:30;
  transition:width .18s ease, flex-basis .18s ease;
}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.logo-full{display:block;height:34px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.logo-mark{display:none;width:34px;height:34px;border-radius:50%;background:#fff}
.icon-btn{
  display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;
  border:1px solid transparent;background:transparent;color:var(--muted);
}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;
  border:0;background:transparent;border-radius:8px;padding:9px 10px;
  color:var(--text-2);font-weight:500;text-align:start;white-space:nowrap;
}
.nav button svg{flex:0 0 18px;color:var(--muted)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav button[aria-current="page"] svg{color:var(--text)}
.nav .count{font-style:normal;margin-inline-start:auto;font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .count.hot{color:var(--bad)}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:6px 8px;line-height:1.5}
.side-foot b{display:block;color:var(--text-2);font-weight:600;margin-bottom:2px}
.app.collapsed .side{flex-basis:64px;width:64px}
.app.collapsed .logo-full,.app.collapsed .nav span,.app.collapsed .nav .count,.app.collapsed .side-foot{display:none}
.app.collapsed .logo-mark{display:block}
.app.collapsed .side-top{flex-direction:column}
.app.collapsed .nav button{justify-content:center;padding:10px 0}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 24px;
}
.menu-btn{display:none}
.search-trigger{
  display:flex;align-items:center;gap:10px;flex:0 1 460px;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;color:var(--muted);text-align:start;
}
.search-trigger:hover{border-color:var(--line-2)}
.search-trigger span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--muted);background:var(--surface-2)}
.spacer{flex:1}
.quick{position:relative}
.menu{
  position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:200px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:6px;z-index:50;
}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:7px;padding:8px 10px;text-align:start;color:var(--text)}
.menu button:hover{background:var(--hover)}
.menu button small{margin-inline-start:auto;color:var(--muted)}

.page{padding-inline:24px;padding-block:22px 60px;max-width:1360px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;margin-bottom:18px}
.page-head h1{font-family:"Noto Kufi Arabic",sans-serif;font-size:21px;font-weight:600;margin:0;line-height:1.35}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:7px 13px;
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:500;white-space:nowrap;
}
.btn:hover{border-color:var(--line-2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.92}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field-in,.page select,.drawer select,.dlg select{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;
}
.field-in:hover,.page select:hover{border-color:var(--line-2)}
.filterbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.filterbar .field-in{min-width:220px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid transparent}
.pill.neutral{background:var(--surface-2);border-color:var(--line);color:var(--text-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.ok{background:var(--ok)}
.avatar{
  display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--accent-soft);color:var(--text);font-size:11px;font-weight:600;flex:0 0 24px;
}
.muted{color:var(--muted)}
.link{border:0;background:transparent;padding:0;color:var(--text);font-weight:600;text-align:start}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- today ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:"Noto Kufi Arabic",sans-serif;font-size:21px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.focus{
  display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 15px;margin-bottom:16px;color:var(--text-2)
}
.focus b{color:var(--text)}
.focus .tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14.5px;font-weight:600;margin:0}
.panel-h .muted{font-size:12.5px}
.rowlist{display:flex;flex-direction:column}
.rowlist > *{border-bottom:1px solid var(--line)}
.rowlist > *:last-child{border-bottom:0}
.frow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 15px;text-align:start;border:0;background:transparent;width:100%}
.frow:hover{background:var(--hover)}
.frow .t{font-weight:600}
.frow .s{color:var(--muted);font-size:12.5px;grid-column:1 / 2}
.frow .r{grid-row:1 / 3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.empty-s{padding:22px 15px;color:var(--muted);text-align:center;font-size:13px}
.act-row{display:flex;gap:10px;padding:10px 15px;align-items:flex-start}
.act-row .when{flex:0 0 70px;color:var(--muted);font-size:12px;padding-top:1px}
.act-row .what{flex:1;min-width:0}
.act-row .what b{font-weight:600}
.act-row .what p{margin:1px 0 0;color:var(--text-2);font-size:13px;overflow-wrap:anywhere}

/* ---------- tasks ---------- */
.task{display:flex;align-items:center;gap:10px;padding:8px 15px}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--ok);flex:0 0 17px;cursor:pointer}
.task .tt{flex:1;min-width:0}
.task .tt input{width:100%;border:0;background:transparent;padding:3px 0;font-weight:500}
.task .tt input:focus{outline:none;border-bottom:1px solid var(--gold)}
.task.done .tt input{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.task input[type=date]{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px;font-size:12.5px;color:var(--muted)}
.task input[type=date]:hover{border-color:var(--line)}
.task.late input[type=date]{color:var(--bad);font-weight:600}
.task select{font-size:12px;padding:2px 6px}
.task .x{opacity:0;transition:opacity .12s}
.task:hover .x,.task:focus-within .x{opacity:1}
.addtask{display:flex;gap:8px;padding:10px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.addtask input.title{flex:1 1 220px}
.tgroup-h{display:flex;align-items:center;gap:8px;padding:9px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-2)}
.tgroup-h.bad{color:var(--bad)}

/* ---------- board ---------- */
.board-wrap{overflow-x:auto;padding-bottom:10px;margin-inline:-4px}
.board{display:flex;gap:12px;align-items:flex-start;padding:2px 4px;min-width:min-content}
.col{flex:0 0 268px;width:268px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.col-h{padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.col-h .n{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.col-h .n span.c{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.col-h .v{font-size:12px;color:var(--muted);margin-top:2px}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:70px}
.col.over{border-color:var(--gold);background:var(--gold-soft)}
.col.unset .col-h .n{color:var(--warn)}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;
  cursor:grab;text-align:start;display:flex;flex-direction:column;gap:6px;
}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.card.dragging{opacity:.45}
.card .c1{display:flex;align-items:center;gap:6px;font-weight:600;justify-content:space-between}
.card .c1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .c2{color:var(--text-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c3{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
.card .val{font-weight:600;font-variant-numeric:tabular-nums}
.card .nx{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline;border-top:1px dashed var(--line);padding-top:6px}
.card .nx b{font-weight:500;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card .nx .late{color:var(--bad);font-weight:600}
.card .idle{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.card .idle.warn{color:var(--warn)} .card .idle.bad{color:var(--bad)}
.dropcol{flex:0 0 150px;width:150px;border:1.5px dashed var(--line-2);border-radius:12px;padding:16px 12px;text-align:center;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:120px}
.dropcol b{font-size:13.5px}
.dropcol.won b{color:var(--ok)} .dropcol.lost b{color:var(--bad)}
.dropcol.over.won{background:var(--ok-soft);border-color:var(--ok)}
.dropcol.over.lost{background:var(--bad-soft);border-color:var(--bad)}
.dropcol .c{font-variant-numeric:tabular-nums}

.strip{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:14px;color:var(--muted);font-size:13px}
.strip b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-inline-start:4px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;min-width:900px}
.tbl th{text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl td.sub{color:var(--muted);font-size:12.5px}
.tbl .main-c b{display:block;font-weight:600}
.tbl .main-c small{color:var(--muted);font-size:12px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100vw);z-index:70;
  background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.dr-h{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dr-h .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dr-h .crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dr-h input.title{font-family:"Noto Kufi Arabic",sans-serif;font-size:18px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:3px 6px;margin-inline:-6px;background:transparent;width:calc(100% + 12px)}
.dr-h input.title:hover{border-color:var(--line)}
.dr-b{flex:1;overflow-y:auto;padding:14px 18px 28px;display:flex;flex-direction:column;gap:18px}
.props{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;align-items:center}
.props label{color:var(--muted);font-size:12.5px}
.props input,.props select,.props textarea{width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px}
.props input:hover,.props select:hover,.props textarea:hover{border-color:var(--line);background:var(--surface-2)}
.props input:focus,.props textarea:focus{border-color:var(--line-2);background:var(--surface);outline:none}
.sec h3{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--text-2)}
.sec h3 .muted{font-weight:400;font-size:12px}
.insight{display:flex;gap:10px;background:var(--warn-soft);color:var(--text-2);border-radius:9px;padding:10px 12px;font-size:13px}
.insight.bad{background:var(--bad-soft)}
.insight.ok{background:var(--ok-soft)}
.insight b.tag{font-size:10.5px;letter-spacing:.06em;color:var(--warn);white-space:nowrap}
.insight.bad b.tag{color:var(--bad)} .insight.ok b.tag{color:var(--ok)}
.next-box{display:grid;grid-template-columns:1fr 150px;gap:8px}
.next-box input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface-2)}
.logger{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.types{display:flex;gap:5px;flex-wrap:wrap}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--text-2)}
.types button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.logger textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-height:52px;resize:vertical}
.logger .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logger input[type=date]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.timeline{position:relative;display:flex;flex-direction:column;gap:12px;padding-inline-start:18px}
.timeline::before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl{position:relative}
.tl::before{content:"";position:absolute;inset-inline-start:-17px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl.stage::before{border-color:var(--gold)}
.tl .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.tl .h b{font-size:13px}
.tl .h .d{color:var(--muted)}
.tl p{margin:2px 0 0;color:var(--text-2);overflow-wrap:anywhere;white-space:pre-wrap}
.tl .rm{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:0;margin-inline-start:auto;opacity:0}
.tl:hover .rm{opacity:1}
.mini-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mini-list > *{border-bottom:1px solid var(--line)}
.mini-list > *:last-child{border-bottom:0}
.mini{display:flex;align-items:center;gap:10px;padding:9px 12px;width:100%;border:0;background:var(--surface);text-align:start}
button.mini:hover{background:var(--hover)}
.mini .grow{flex:1;min-width:0}
.mini .grow b{display:block;font-weight:600}
.mini .grow small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.person-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:var(--surface-2)}
.person-form input{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface)}
.dr-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}

/* ---------- contracts ---------- */
.contract{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.contract.is-late{border-color:var(--bad)}
.c-head{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:13px 16px}
.c-name{display:flex;flex-direction:column;gap:2px;min-width:200px}
.c-name b{font-size:15px}
.c-name small{color:var(--muted)}
.c-figs{display:flex;gap:22px;flex-wrap:wrap;margin-inline-start:auto;font-size:12px;color:var(--muted)}
.c-figs div{display:flex;flex-direction:column}
.c-figs b{font-size:14.5px;color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--surface-2)}
.bar > span{display:block;height:100%;background:var(--gold)}
.c-meta{display:flex;flex-wrap:wrap;gap:10px 14px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.c-meta label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600;flex:1 1 150px}
.c-meta input,.c-meta select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);font-size:13px;font-weight:400;color:var(--text)}
.pay{width:100%;border-collapse:collapse;min-width:720px}
.pay th{text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:7px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pay td{padding:6px 12px;border-bottom:1px solid var(--line)}
.pay tr:last-child td{border-bottom:0}
.pay input{border:1px solid transparent;border-radius:6px;padding:4px 7px;background:transparent;width:100%}
.pay input:hover{border-color:var(--line)}
.pay input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok)}
.pay tr.overdue td.due input{color:var(--bad);font-weight:600}
.pay tr.paid{background:var(--ok-soft)}
.c-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.c-warn{padding:8px 16px;border-top:1px solid var(--line);color:var(--bad);font-size:12.5px}

/* ---------- dialogs & palette ---------- */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:0;box-shadow:var(--shadow);width:min(560px,94vw)}
dialog::backdrop{background:var(--scrim)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:15.5px;font-weight:600}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;max-height:68vh;overflow-y:auto}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.wide{grid-column:1 / -1}
.fld > span{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);width:100%}
.fld textarea{min-height:64px;resize:vertical}
.fld.check{flex-direction:row;align-items:center;gap:8px}
.fld.check input{width:16px;height:16px;accent-color:var(--gold)}
.fld small{color:var(--muted);font-size:11.5px}
.dlg-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
#palette{width:min(620px,94vw);margin-top:10vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:transparent;font-size:15.5px;outline:none}
.pal-res{max-height:56vh;overflow-y:auto;padding:6px}
.pal-g{font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px 4px}
.pal-i{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:start}
.pal-i[aria-selected="true"],.pal-i:hover{background:var(--hover)}
.pal-i .grow{flex:1;min-width:0}
.pal-i .grow b{display:block;font-weight:600}
.pal-i .grow small{color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;z-index:90;box-shadow:var(--shadow)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .side{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(100%);transition:transform .2s ease;box-shadow:var(--shadow);width:240px}
  .app.nav-open .side{transform:none}
  .app.collapsed .side{width:240px;flex-basis:240px}
  .app.collapsed .logo-full,.app.collapsed .nav span,.app.collapsed .nav .count,.app.collapsed .side-foot{display:revert}
  .app.collapsed .logo-mark{display:none}
  #collapse{display:none}
  .menu-btn{display:inline-grid}
  .top{padding:10px 16px}
  .search-trigger kbd{display:none}
  .page{padding-inline:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .props{grid-template-columns:1fr}
  .next-box{grid-template-columns:1fr}
  .dlg-b{grid-template-columns:1fr}
  .col{max-height:none}
}
@media print{
  .side,.top,.drawer,.scrim,.head-actions,.filterbar,.c-foot,.c-meta,.no-print{display:none!important}
  .page{padding:0;max-width:none}
  body,html{background:#fff}
  .tbl-wrap{overflow:visible;border-color:#999}
  table.tbl,.pay{min-width:0}
  .contract{break-inside:avoid}
  input,select{border:0!important;background:transparent!important;-webkit-appearance:none;appearance:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function buildSchedule(total, terms, start, advPct, count){
  start = start || today();
  const P = (label, amount, due) => ({id: uid("p"), label, amount, due, paid: false, paidDate: "", invoice: ""});
  if (terms === "دفعة واحدة") return [P("الدفعة الكاملة", total, start)];
  if (terms === "دفعات متعددة"){
    const n = Math.max(2, Math.min(24, Number(count) || 3)), per = Math.round(total / n);
    return Array.from({length: n}, (_, i) => P("الدفعة " + (i + 1) + " من " + n, i === n - 1 ? total - per * (n - 1) : per, i === 0 ? start : ""));
  }
  const pct = Math.max(1, Math.min(99, Number(advPct) || 50)), adv = Math.round(total * pct / 100);
  return [P("دفعة مقدمة (" + pct + "%)", adv, start), P("دفعة مؤخرة (" + (100 - pct) + "%)", total - adv, "")];
}

function formModal(title, fields, submitLabel, onSubmit){
  const dlg = $("formDlg"), form = $("formEl");
  form.innerHTML = "";
  const inputs = {};
  const body = h("div", {class:"dlg-b"});
  fields.forEach(f => {
    let ctl;
    if (f.type === "select") ctl = h("select", null, f.options.map(o => h("option", {value: o[0] != null ? o[0] : o, text: o[1] != null ? o[1] : o, selected: (o[0] != null ? o[0] : o) === f.value})));
    else if (f.type === "textarea") ctl = h("textarea", {value: f.value || "", placeholder: f.ph || ""});
    else if (f.type === "check") ctl = h("input", {type:"checkbox", checked: !!f.value});
    else ctl = h("input", {type: f.type || "text", value: f.value == null ? "" : f.value, placeholder: f.ph || "", list: f.list || null, required: !!f.req, dir: f.dir || null});
    inputs[f.key] = ctl;
    body.append(f.type === "check" ? h("label", {class:"fld check wide"}, ctl, h("span", {text: f.label}))
      : h("label", {class:"fld" + (f.wide ? " wide" : "")}, h("span", {text: f.label + (f.req ? " *" : "")}), ctl, f.hint ? h("small", {text: f.hint}) : null));
  });
  form.append(h("div", {class:"dlg-h"}, h("h3", {text: title}), h("button", {type:"button", class:"icon-btn", "aria-label":"إغلاق", text:"✕", onclick: () => dlg.close()})),
    body, h("div", {class:"dlg-f"}, h("button", {type:"submit", class:"btn primary", text: submitLabel}), h("button", {type:"button", class:"btn", text:"إلغاء", onclick: () => dlg.close()})));
  form.onsubmit = e => {
    const vals = {};
    for (const k in inputs) vals[k] = inputs[k].type === "checkbox" ? inputs[k].checked : inputs[k].value.trim();
    const r = onSubmit(vals);
    if (r === false){ e.preventDefault(); }
  };
  dlg.showModal();
  const first = body.querySelector("input,select,textarea"); if (first) setTimeout(() => first.focus(), 20);
}
function ensureAccount(name, kind, acquired){
  let a = S.accounts.find(x => x.name === name);
  if (!a) a = add("accounts", {id: uid("ac"), name, kind: kind || "", phone:"", email:"", acquired: !!acquired, notes:"", contacts: [], createdAt: nowISO()});
  else if (acquired && !a.acquired){ a.acquired = true; put("accounts", a); }
  return a;
}

/* ================= search palette ================= */
const pal = $("palette"), palIn = $("palInput"), palRes = $("palRes");
let palItems = [], palSel = 0;
function openPalette(){ palIn.value = ""; runSearch(); pal.showModal(); palIn.focus(); }
function runSearch(){
  const q = palIn.value.trim();
  palRes.innerHTML = ""; palItems = [];
  const groups = [];
  const match = s => s && s.includes(q);
  if (!q){
    const recent = S.deals.filter(isOpen).sort((a, b) => lastTouch(b).localeCompare(lastTouch(a))).slice(0, 6);
    groups.push(["فرص نشطة", recent.map(d => ({t: (accName(d.account)), s: d.title + " · " + STAGE_NAME[d.stage], go: () => openDrawer("deal", d.id)}))]);
  } else {
    const accs = [], ppl = [];
    S.accounts.forEach(a => {
      if (match(a.name) || match(a.phone) || match(a.email)) accs.push({t: a.name, s: [a.kind, a.phone].filter(Boolean).join(" · ") || "عميل", go: () => openDrawer("account", a.id)});
      (a.contacts || []).forEach(c => { if (match(c.name) || match(c.phone) || match(c.email) || match(c.title))
        ppl.push({t: c.name, s: [c.title, a.name, c.phone].filter(Boolean).join(" — "), go: () => openDrawer("account", a.id)}); });
    });
    const ows = owners().filter(o => match(o)).map(o => ({t: "عملاء " + o, s: S.accounts.filter(a => ownsAcc(a, o)).length + " عميل · " + S.deals.filter(d => isOpen(d) && ownsDeal(d, o)).length + " فرصة مفتوحة",
      go: () => { ui.owner = o; try { localStorage.setItem("crm.owner", o); } catch (e) {} ui.drawer = null; go("accounts"); }}));
    groups.push(["المسؤولون", ows], ["العملاء", accs], ["صنّاع القرار", ppl]);
    groups.push(["الفرص", S.deals.filter(d => match(d.title) || match(d.service) || match(d.next) || match(d.desc)).map(d => ({t: d.title, s: accName(d.account) + " · " + STAGE_NAME[d.stage], go: () => openDrawer("deal", d.id)}))]);
    groups.push(["المهام", S.todos.filter(t => match(t.title)).map(t => ({t: t.title, s: (t.done ? "منجزة" : (t.due ? dueLabel(t.due) : "بدون تاريخ")) + (t.account ? " · " + accName(t.account) : ""), go: () => go("tasks")}))]);
    groups.push(["النشاطات", S.acts.filter(a => match(a.text)).slice(0, 8).map(a => ({t: a.type + " — " + accName(a.account), s: fmtDate(a.date) + " · " + a.text, go: () => a.deal ? openDrawer("deal", a.deal) : openDrawer("account", a.account)}))]);
  }
  groups.forEach(([name, items]) => {
    if (!items.length) return;
    palRes.append(h("div", {class:"pal-g", text: name}));
    items.slice(0, 6).forEach(it => {
      const i = palItems.length;
      const b = h("button", {class:"pal-i", type:"button", "aria-selected": String(i === 0), onclick: () => { pal.close(); it.go(); }},
        h("span", {class:"avatar", text: initials(it.t)}), h("span", {class:"grow"}, h("b", {text: it.t}), h("small", {text: it.s})));
      palItems.push({el: b, go: it.go});
      palRes.append(b);
    });
  });
  if (!palItems.length) palRes.append(h("div", {class:"empty-s", text: q ? "لا توجد نتائج لـ «" + q + "»" : "ابدأ بالكتابة للبحث"}));
  palSel = 0;
}
palIn.addEventListener("input", runSearch);
palIn.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if (!palItems.length) return;
    palItems[palSel].el.setAttribute("aria-selected", "false");
    palSel = (palSel + (e.key === "ArrowDown" ? 1 : -1) + palItems.length) % palItems.length;
    palItems[palSel].el.setAttribute("aria-selected", "true");
    palItems[palSel].el.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter"){ e.preventDefault(); if (palItems[palSel]){ pal.close(); palItems[palSel].go(); } }
});
pal.addEventListener("click", e => { if (e.target === pal) pal.close(); });

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape" && ui.drawer && !document.querySelector("dialog[open]")){ closeDrawer(); return; }
  const inField = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "") || document.querySelector("dialog[open]");
  if (inField || e.ctrlKey || e.metaKey || e.altKey) return;

  else if (e.key.toLowerCase() === "n" || e.key === "ى"){ e.preventDefault(); formDeal(); }

(async () => {
  try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e) { db = null; }
  if (!db){ setSync("غير متصل — لا يمكن الحفظ في هذا العرض"); loaded = true; render(true); return; }
  live = true; setSync("متصل — التعديلات تُحفظ تلقائيًا");
  let waiting = 4;
  ["accounts","deals","acts","todos"].forEach(col => {
    let first = true;
    db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => NORM[col](d.id, d.data() || {}));
      if (first){ first = false; if (--waiting === 0) loaded = true; }
      if (loaded) schedule();
    }, () => setSync("انقطع الاتصال — أعد تحميل الصفحة"));
  });
  setTimeout(() => { if (!loaded){ loaded = true; render(true); } }, 8000);
})();
